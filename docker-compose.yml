services:
  prosijil:
    build: .
    container_name: prosijil-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIR: /app/server/data
    ports:
      - "4000:4000"
    volumes:
      - prosijil_data:/app/server/data
volumes:
  prosijil_data:
